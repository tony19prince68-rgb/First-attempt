<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Pause on the first word you see." 7 s, loops: the last frame is the first frame.
const W = 1080, H = 1920, CX = 540, DUR = 7
const ctx = document.getElementById('c').getContext('2d')
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x) }
const FONT = (w, s) => `${w} ${s}px "Inter Display", Inter, "Noto Color Emoji", sans-serif`

// [word, centre x, centre y, size, weight, colour]
const WORDS = [
  ['REST',              290,  520, 116, 900, '#ffffff'],
  ['LEAVING',           730,  520,  84, 800, '#B79BFF'],
  ['THE TRUTH',         540,  645, 100, 900, '#ffffff'],
  ['ANGER',             270,  770,  80, 800, '#ffffff'],
  ['SAYING NO',         730,  770,  74, 700, '#ffffff'],
  ['GRIEF',             540,  900, 128, 900, '#F5C26B'],
  ['ASKING FOR HELP',   540, 1030,  70, 800, '#B79BFF'],
  ['LOVE',              270, 1150, 104, 900, '#ffffff'],
  ['SILENCE',           730, 1150,  82, 800, '#ffffff'],
  ['STARTING OVER',     540, 1270,  76, 800, '#ffffff'],
  ['MONEY',             270, 1390,  70, 700, '#ffffff'],
  ['YOUR BODY',         700, 1390,  66, 700, '#B79BFF'],
]

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H)
  const dim = ease((t - 4.9) / .35) * (1 - ease((t - 6.65) / .3))     // words step back for the reveal, return for the loop
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  // instruction, on screen from frame one
  ctx.globalAlpha = 1 - dim
  ctx.font = FONT(800, 66); ctx.fillStyle = '#fff'
  ctx.fillText('Pause on the first', CX, 300); ctx.fillText('word you see.', CX, 385)
  // the words: a slow breathing drift, each on its own phase, so nothing sits still
  WORDS.forEach(([w, x, y, s, wt, col], i) => {
    const ph = i * 1.7, dx = Math.sin(t * 0.9 + ph) * 6, dy = Math.cos(t * 0.8 + ph) * 5
    const sc = 1 + 0.025 * Math.sin(t * 1.1 + ph)
    ctx.save(); ctx.translate(x + dx, y + dy); ctx.scale(sc, sc)
    ctx.globalAlpha = 1 - dim * .93
    ctx.font = FONT(wt, s); ctx.fillStyle = col; ctx.fillText(w, 0, 0)
    ctx.restore()
  })
  // the reveal
  const r = ease((t - 5.0) / .3) * (1 - ease((t - 6.65) / .3))
  if (r > 0) {
    ctx.globalAlpha = r
    ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 40
    ctx.font = FONT(900, 112); ctx.fillStyle = '#fff'
    ctx.fillText('That’s what', CX, 880); ctx.fillText('you’ve been', CX, 1000); ctx.fillText('avoiding.', CX, 1120)
    const c = ease((t - 5.7) / .3) * (1 - ease((t - 6.65) / .3))
    ctx.globalAlpha = c; ctx.font = FONT(700, 60); ctx.fillStyle = '#B79BFF'
    ctx.fillText('Comment your word 👇', CX, 1270)
    ctx.shadowBlur = 0
  }
  ctx.globalAlpha = 1
}

window.__scene = {
  duration: DUR,
  ready: Promise.all([document.fonts.load(FONT(900, 80)), document.fonts.load(FONT(800, 80)), document.fonts.load(FONT(700, 80)), document.fonts.load('80px "Noto Color Emoji"')]).then(() => draw(0)),
  seek: async t => draw(t),
  sounds: [
    { t: 5.0, kind: 'boom', v: .35 },
    { t: 5.7, kind: 'pop', v: .25 },
    { t: 6.65, kind: 'whoosh', dur: .35, v: .15 },
  ],
}
</script>
</body></html>

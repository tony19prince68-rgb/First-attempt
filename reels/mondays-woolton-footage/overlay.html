<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mondays at Woolton footage reel</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0d0a0b;
    --pink: #ff4f9a;
    --blush: #f9b8d0;
    --gold: #e9b44c;
    --red: #d7263d;
    --cream: #fff4ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: Inter, sans-serif; color: var(--cream); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(40px) brightness(0.35) saturate(1.2); }
  /* sharp photo card; the source photos are small, so they never go full screen */
  .card {
    position: absolute; left: 0; top: 300px; width: 1080px; height: 608px;
    border-top: 6px solid var(--gold); border-bottom: 6px solid var(--gold);
  }
  .card div { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .text { position: absolute; left: 90px; right: 150px; top: 990px; }
  .line { opacity: 0; }
  .western { font-family: Rye, serif; font-weight: 400; line-height: 1.05; }
  .h { font-size: 124px; }
  .m { font-size: 64px; font-weight: 900; line-height: 1.2; }
  .s { font-size: 48px; font-weight: 700; line-height: 1.35; }
  .pink { color: var(--pink); } .gold { color: var(--gold); } .blush { color: var(--blush); }
  .rule { width: 180px; height: 10px; background: var(--red); border-radius: 5px; margin: 40px 0; }
  .handle { position: absolute; left: 90px; top: 200px; font-size: 40px; font-weight: 900; color: var(--blush); letter-spacing: 1px; z-index: 5; }
</style>
</head>
<body>

<div class="handle">@mkbparty.live</div>

<section class="scene" data-start="0" data-end="3">
  <div class="card"><div></div></div>
  <div class="text">
    <p class="line western h" data-at="0.15">Never line<br><span class="pink">danced?</span></p>
    <div class="line rule" data-at="0.9"></div>
    <p class="line m gold" data-at="1.2">Start on Monday.</p>
  </div>
</section>

<section class="scene" data-start="3" data-end="6">
  <div class="card"><div></div></div>
  <div class="text">
    <p class="line m gold" data-at="0.1">EVERY MONDAY</p>
    <p class="line western h pink" data-at="0.4" style="font-size:108px">Woolton<br>Village Club</p>
    <div class="line rule" data-at="1.0"></div>
    <p class="line m" data-at="1.2">6.30 to 8.30pm</p>
  </div>
</section>

<section class="scene" data-start="6" data-end="8.6">
  <div class="card"><div></div></div>
  <div class="text">
    <p class="line western h" data-at="0.1">No partner<br><span class="pink">needed.</span></p>
    <div class="line rule" data-at="0.8"></div>
    <p class="line m gold" data-at="1.0">You just join a line.</p>
  </div>
</section>

<section class="scene" data-start="8.6" data-end="11.2">
  <div class="card"><div></div></div>
  <div class="text">
    <p class="line western h pink" data-at="0.1">Beginners</p>
    <p class="line western h gold" data-at="0.5">and all levels</p>
    <div class="line rule" data-at="1.0"></div>
    <p class="line m" data-at="1.2">Come anyway.</p>
  </div>
</section>

<section class="scene" data-start="11.2" data-end="15">
  <div class="card"><div></div></div>
  <div class="text">
    <p class="line western h pink" data-at="0.1" style="font-size:150px">£8.50</p>
    <p class="line m" data-at="0.4">booked at <span class="gold">mkbparty.com</span></p>
    <p class="line s blush" data-at="0.7">£10 on the night</p>
    <div class="line rule" data-at="1.1"></div>
    <p class="line m" data-at="1.4">Send this to the friend<br>you're bringing.</p>
  </div>
</section>

<script>
  const FADE = 0.3;
  const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  window.setT = t => {
    document.querySelectorAll('.scene').forEach(sc => {
      const s = +sc.dataset.start, e = +sc.dataset.end;
      let o = 0;
      if (t >= s - FADE && t < e) o = Math.min(1, (t - s + FADE) / FADE);
      if (t >= e - FADE && t < e) o = Math.min(o, (e - t) / FADE);
      if (e === 15 && t >= e - FADE) o = 1;
      sc.style.opacity = o;
      // slow push-in on the photo card
      const p = Math.min(Math.max((t - s) / (e - s), 0), 1);
      sc.querySelector('.card div').style.transform = `scale(${1.02 + 0.08 * p})`;
      sc.querySelectorAll('.line').forEach(l => {
        const k = ease((t - s - +l.dataset.at) / 0.4);
        l.style.opacity = k;
        l.style.transform = `translateY(${(1 - k) * 50}px)`;
      });
    });
  };
  setT(0);
</script>
</body>
</html>
